[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bluebell-notes"
version = "0.1.0"
description = "A quiet, local Markdown notebook"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.10,<6.12",
    "markdown-it-py>=4,<5",
    "mdit-py-plugins>=0.5,<0.7",
    "Send2Trash>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.5,<5"]

[project.scripts]
bluebell = "bluebell.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"
